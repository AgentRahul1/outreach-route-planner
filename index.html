<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://router.project-osrm.org https://*; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; manifest-src 'self'; worker-src 'self'">
<title>Outreach Route Planner</title>
<meta name="description" content="Plan the shortest order for your stops and open it in Google Maps.">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outreach Route Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Outreach Route Planner</h1><button id="btnSettings" class="icon" aria-label="Settings">⚙︎</button></header>
<main>
  <section class="card">
    <h2>Start</h2>
    <div class="seg" id="originMode" role="tablist">
      <button data-v="saved" class="on">Saved</button><button data-v="gps">My location</button><button data-v="typed">Type address</button>
    </div>
    <div id="originSaved" class="pane"><select id="savedSelect" class="big"></select></div>
    <div id="originGps" class="pane hidden"><button id="btnGps" class="btn secondary">📍 Use current location</button><div id="gpsStatus" class="muted"></div></div>
    <div id="originTyped" class="pane hidden"><input id="originInput" class="big" placeholder="Start address" autocomplete="off">
      <button id="btnSaveOrigin" class="link">☆ Save this start</button></div>
  </section>

  <section class="card">
    <h2>Stops <span id="stopCount" class="pill">0</span></h2>
    <textarea id="stopsInput" rows="3" placeholder="Type or paste addresses or lat,lng — one per line"></textarea>
    <button id="btnAddStops" class="btn secondary">+ Add stops</button>
    <ul id="stopList" class="list"></ul>
    <button id="btnClearStops" class="link danger hidden">Clear all stops</button>
  </section>

  <section class="card">
    <h2>End</h2>
    <div class="seg" id="endMode">
      <button data-v="return" class="on">Back to start</button><button data-v="last">Last stop</button><button data-v="addr">Other address</button>
    </div>
    <div id="endAddrPane" class="pane hidden"><input id="endInput" class="big" placeholder="End address or lat,lng" autocomplete="off"></div>
  </section>

  <button id="btnPlan" class="btn primary">Plan route</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="results" class="card hidden">
    <h2>Your route</h2>
    <div id="totals" class="totals"></div>
    <ol id="legList" class="legs"></ol>
    <div id="mapsBtns"></div>
  </section>
  <p class="muted small center">Addresses stay on this phone only. Map data © OpenStreetMap contributors · Routing by OSRM.</p>
</main>

<dialog id="pickDlg"><form method="dialog">
  <h3>Which one did you mean?</h3><p id="pickQuery" class="muted"></p>
  <div id="pickOpts" class="opts"></div>
  <div class="row"><button value="cancel" class="btn secondary">Cancel</button></div>
</form></dialog>

<dialog id="settingsDlg"><form method="dialog">
  <h3>Settings</h3>
  <label>Saved starts</label><ul id="savedList" class="list compact"></ul>
  <div class="row"><input id="newSavedName" placeholder="Name (e.g. Office)"><input id="newSavedAddr" placeholder="Address or lat,lng"></div>
  <button id="btnAddSaved" type="button" class="btn secondary">+ Add saved start</button>
  <label for="maxWp">Stops per Google Maps link</label>
  <select id="maxWp" class="big"><option value="9">9 (Google Maps app — recommended)</option><option value="3">3 (if links open in Safari instead)</option></select>
  <label for="osrmUrl">Routing server (OSRM)</label><input id="osrmUrl" class="big">
  <label for="contactEmail">Your email for Nominatim (optional, recommended by their policy)</label><input id="contactEmail" class="big" type="email" placeholder="optional">
  <button id="btnClearCache" type="button" class="btn secondary">Clear saved address lookups</button>
  <button id="btnWipe" type="button" class="btn danger">Erase everything on this phone</button>
  <div class="row"><button value="close" class="btn primary">Done</button></div>
  <p class="muted small">Version <span id="ver"></span></p>
</form></dialog>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
